<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="読点と句点をカンマ・ピリオドへ相互変換するプレーンテキスト変換ツールです。">
  <meta name="theme-color" content="#126c61">
  <title>句読点変換</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">plain text converter</p>
        <h1>句読点変換</h1>
      </div>
    </header>

    <section class="tool-controls" aria-label="変換設定">
      <fieldset class="direction-control">
        <legend>変換方向</legend>
        <div class="segmented-control">
          <label>
            <input type="radio" name="conversionDirection" value="forward" checked>
            <span>、。→，．</span>
          </label>
          <label>
            <input type="radio" name="conversionDirection" value="reverse">
            <span>，．→、。</span>
          </label>
        </div>
      </fieldset>
    </section>

    <section class="workspace" aria-label="変換エリア">
      <div class="editor-panel">
        <div class="panel-head">
          <label for="sourceText">入力</label>
          <button class="icon-button text-button" id="clearButton" type="button">消去</button>
        </div>
        <textarea id="sourceText" spellcheck="false" placeholder="ここに文章を貼り付け" autofocus></textarea>
      </div>

      <div class="editor-panel">
        <div class="panel-head">
          <label for="convertedText">変換結果</label>
          <button class="icon-button primary-button" id="copyButton" type="button">コピー</button>
        </div>
        <textarea id="convertedText" spellcheck="false" placeholder="変換結果" readonly></textarea>
      </div>
    </section>

    <section class="count-panel" aria-label="文字数カウント">
      <div class="count-grid">
        <div class="count-item">
          <span class="count-label">文字数</span>
          <strong class="count-value" id="charCount">0</strong>
          <span class="count-unit">文字</span>
        </div>
        <div class="count-item">
          <span class="count-label">改行除く</span>
          <strong class="count-value" id="noLineBreakCount">0</strong>
          <span class="count-unit">文字</span>
        </div>
        <div class="count-item">
          <span class="count-label">改行・空白除く</span>
          <strong class="count-value" id="noWhitespaceCount">0</strong>
          <span class="count-unit">文字</span>
        </div>
        <div class="count-item">
          <span class="count-label">行数</span>
          <strong class="count-value" id="lineCount">0</strong>
          <span class="count-unit">行</span>
        </div>
        <div class="count-item">
          <span class="count-label">原稿用紙</span>
          <strong class="count-value" id="manuscriptCount">0</strong>
          <span class="count-unit">枚</span>
        </div>
        <div class="count-item">
          <span class="count-label">異体字</span>
          <strong class="count-value" id="variantCount">0</strong>
          <span class="count-unit">文字</span>
        </div>
        <div class="count-item">
          <span class="count-label">UTF-8</span>
          <strong class="count-value" id="utf8Bytes">0</strong>
          <span class="count-unit">バイト</span>
        </div>
        <div class="count-item">
          <span class="count-label">UTF-16</span>
          <strong class="count-value" id="utf16Bytes">0</strong>
          <span class="count-unit">バイト</span>
        </div>
        <div class="count-item">
          <span class="count-label">Shift-JIS</span>
          <strong class="count-value" id="shiftJisBytes">0</strong>
          <span class="count-unit">バイト</span>
        </div>
        <div class="count-item">
          <span class="count-label">EUC-JP</span>
          <strong class="count-value" id="eucJpBytes">0</strong>
          <span class="count-unit">バイト</span>
        </div>
        <div class="count-item">
          <span class="count-label">JIS</span>
          <strong class="count-value" id="jisBytes">0</strong>
          <span class="count-unit">バイト</span>
        </div>
      </div>
    </section>

    <footer class="status-bar" aria-live="polite">
      <span id="replacementCount">置換 0件</span>
      <span id="copyStatus">コピー待機中</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>

</html>
