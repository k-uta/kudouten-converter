<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="論文や研究費申請書向けに、読点と句点をカンマ・ピリオドへ置換するプレーンテキスト変換ツールです。"
    >
    <title>句読点変換</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">plain text converter</p>
          <h1>句読点変換</h1>
        </div>
        <div class="rule-strip" aria-label="置換ルール">
          <span>、 → ，</span>
          <span>。 → ．</span>
        </div>
      </header>

      <section class="workspace" aria-label="変換エリア">
        <div class="editor-panel">
          <div class="panel-head">
            <label for="sourceText">入力</label>
            <button class="icon-button text-button" id="clearButton" type="button">消去</button>
          </div>
          <textarea
            id="sourceText"
            spellcheck="false"
            placeholder="ここに文章を貼り付け"
            autofocus
          ></textarea>
        </div>

        <div class="editor-panel">
          <div class="panel-head">
            <label for="convertedText">変換結果</label>
            <button class="icon-button primary-button" id="copyButton" type="button">コピー</button>
          </div>
          <textarea
            id="convertedText"
            spellcheck="false"
            placeholder="変換結果"
            readonly
          ></textarea>
        </div>
      </section>

      <footer class="status-bar" aria-live="polite">
        <span id="charCount">0文字</span>
        <span id="replacementCount">置換 0件</span>
        <span id="copyStatus">コピー待機中</span>
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
